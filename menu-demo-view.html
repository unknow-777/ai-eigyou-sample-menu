<title id="pageTitle">Sample Menu</title>

<style>
:root{
  --bg:#FFFFFF;
  --text:#242220;
  --text-muted:#757068;
  --line:#E9E6E1;
  --photo-bg:#F1EEE9;
  --price:#242220;
  --danger:#B23B3B;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Noto Sans JP','Noto Sans SC','Noto Sans TC','Noto Sans KR','Noto Sans',-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:36px 18px 64px;
}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.topbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.icon-btn{
  background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  font-size:0.95rem;color:var(--text-muted);cursor:pointer;font-family:inherit;
  text-decoration:none;display:inline-block;
}
.demo-badge{
  font-size:0.66rem; letter-spacing:0.12em; font-weight:700; color:var(--text-muted);
  background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:5px 11px;
  display:inline-block;
}
.store-name{text-align:center;font-size:2.6rem;font-weight:700;letter-spacing:0.01em;margin-top:8px;}

.type-switch-wrap{margin-top:22px;text-align:center;}
.type-switch-label{
  font-size:0.66rem;letter-spacing:0.14em;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;margin-bottom:9px;
}
.type-switch{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.type-pill{
  font-size:0.86rem;font-weight:600;padding:8px 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg);color:var(--text-muted);
  cursor:pointer;font-family:inherit;
}
.type-pill[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text);}
.type-pill:focus-visible{outline:2px solid var(--text);outline-offset:2px;}

.lang-tabs{display:flex;justify-content:center;gap:8px;margin-top:28px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:6px;}
.lang-tab{background:none;border:none;padding:6px 2px 12px;font-size:1.15rem;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;white-space:nowrap;}
.lang-tab[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:700;}
.lang-tab:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
.category{
  margin-top:44px;margin-bottom:16px;font-size:1.08rem;font-weight:700;letter-spacing:0.1em;
  color:var(--text);padding-bottom:8px;border-bottom:2px solid var(--text);display:inline-block;
}
.item{display:flex;gap:20px;padding:20px 0;align-items:flex-start;}
.item-photo{
  width:132px;height:132px;border-radius:16px;background:var(--photo-bg);
  display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0;
  overflow:hidden;box-shadow:0 2px 10px rgba(36,34,32,0.10);
}
.item-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.item-main{flex:1;min-width:0;padding-top:2px;}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.item-name{font-size:1.34rem;line-height:1.35;font-weight:600;}
.item-price{font-variant-numeric:tabular-nums;color:var(--price);font-weight:700;font-size:1.2rem;white-space:nowrap;}
.item-desc{margin-top:6px;font-size:0.96rem;color:var(--text-muted);line-height:1.55;}
.note{margin-top:44px;font-size:0.86rem;color:var(--text-muted);line-height:1.7;text-align:center;}

.state-box{
  margin-top:60px;text-align:center;color:var(--text-muted);font-size:1.05rem;line-height:1.8;
}
.state-box.error{color:var(--danger);}
.spinner{
  width:36px;height:36px;margin:0 auto 18px;border-radius:50%;
  border:4px solid var(--line);border-top-color:var(--text);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none;}}
.retry-btn{
  margin-top:14px;padding:10px 22px;border:1px solid var(--text);border-radius:999px;
  background:none;color:var(--text);font-size:0.95rem;cursor:pointer;font-family:inherit;
}
</style>

<div class="page">
  <div class="topbar">
    <a class="icon-btn" href="menu-demo.html">← TOPページ</a>
    <div class="topbar-left">
      <div class="demo-badge">DEMO</div>
      <a class="icon-btn" href="demo-admin.html">管理画面へ →</a>
    </div>
  </div>
  <div class="store-name" id="storeName">&nbsp;</div>

  <div class="type-switch-wrap">
    <div class="type-switch-label">業種別サンプルを見る</div>
    <div class="type-switch" id="typeSwitch" role="group" aria-label="業種サンプル"></div>
  </div>

  <div id="loadingState" class="state-box">
    <div class="spinner"></div>
    <div id="loadingText">読み込み中…</div>
  </div>

  <div id="errorState" class="state-box error" hidden>
    <div id="errorText">メニューを読み込めませんでした。通信環境をご確認のうえ、もう一度お試しください。</div>
    <button type="button" class="retry-btn" id="retryBtn">再読み込み</button>
  </div>

  <div id="menuRoot" hidden>
    <div class="lang-tabs" id="langTabs" role="group" aria-label="Language"></div>
    <div id="menuBody"></div>
    <p class="note" id="noteText"></p>
  </div>
</div>

<script>
"use strict";

// この画面(ページ)を開いた瞬間は必ず最上部から表示する。
// 通常読み込みだけでなく、ブラウザの「戻る」操作でbfcacheから復元された場合も対象。
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
window.addEventListener("pageshow", function () { window.scrollTo(0, 0); });

// 5言語構成: 日本語・英語・簡体字中国語・繁体字中国語・韓国語。
// 中国語は1つにまとめず、zh-Hans(简体中文)とzh-Hant(繁體中文)を別データとして保持する。
var LANGS = [
  { code: "ja", label: "日本語" },
  { code: "en", label: "English" },
  { code: "zh-Hans", label: "简体中文" },
  { code: "zh-Hant", label: "繁體中文" },
  { code: "ko", label: "한국어" }
];

var NOTE = {
  ja: "表示している内容は準備状況により一部日本語のみとなる場合があります。",
  en: "Some items may be shown in Japanese only depending on translation availability.",
  "zh-Hans": "部分菜品可能仅显示日文，具体取决于翻译情况。",
  "zh-Hant": "部分品項可能僅顯示日文，視翻譯完成度而定。",
  ko: "번역 준비 상황에 따라 일부 메뉴는 일본어로만 표시될 수 있습니다."
};

var PRODUCTS = null;
var currentLang = "ja";

// 表示言語のデータが無い場合のフォールバック順:
// zh-Hant → zh-Hans(繁体字が無ければ簡体字で代用) → ja(最終手段は日本語)。
// en/ko/zh-Hansはja直行。
function textOrFallback(field, lang) {
  if (!field) return "";
  if (field[lang]) return field[lang];
  if (lang === "zh-Hant" && field["zh-Hans"]) return field["zh-Hans"];
  return field.ja || "";
}

function els() {
  return {
    loading: document.getElementById("loadingState"),
    error: document.getElementById("errorState"),
    root: document.getElementById("menuRoot"),
  };
}

function showLoading() {
  var e = els();
  e.loading.hidden = false;
  e.error.hidden = true;
  e.root.hidden = true;
}
function showError() {
  var e = els();
  e.loading.hidden = true;
  e.error.hidden = false;
  e.root.hidden = true;
}
function showMenu() {
  var e = els();
  e.loading.hidden = true;
  e.error.hidden = true;
  e.root.hidden = false;
}

function render(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-tab").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });

  var storeNameText = textOrFallback(PRODUCTS.store_name, lang) || "Menu";
  document.getElementById("storeName").textContent = storeNameText;
  document.getElementById("pageTitle").textContent = storeNameText + " Menu";

  var body = document.getElementById("menuBody");
  body.innerHTML = "";

  var visibleItems = PRODUCTS.items.filter(function (it) { return it.published !== false; });

  PRODUCTS.categories.forEach(function (cat) {
    var itemsInCat = visibleItems.filter(function (it) { return it.category === cat.id; });
    if (itemsInCat.length === 0) return;

    var catDiv = document.createElement("div");
    catDiv.className = "category";
    catDiv.textContent = textOrFallback(cat.name, lang);
    body.appendChild(catDiv);

    itemsInCat.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "item";

      var photo = document.createElement("div");
      photo.className = "item-photo";
      if (it.image) {
        var img = document.createElement("img");
        img.src = it.image;
        img.alt = textOrFallback(it.name, lang);
        img.loading = "lazy";
        img.onerror = function () {
          photo.innerHTML = "";
          photo.textContent = it.icon || "🍽";
        };
        photo.appendChild(img);
      } else {
        photo.textContent = it.icon || "🍽";
      }
      row.appendChild(photo);

      var main = document.createElement("div");
      main.className = "item-main";

      var top = document.createElement("div");
      top.className = "item-top";
      var nameSpan = document.createElement("span");
      nameSpan.className = "item-name";
      nameSpan.textContent = textOrFallback(it.name, lang) || "(no name)";
      var priceSpan = document.createElement("span");
      priceSpan.className = "item-price";
      var priceNum = Number(it.price);
      priceSpan.textContent = isFinite(priceNum) ? "¥" + priceNum.toLocaleString("en-US") : "";
      top.appendChild(nameSpan);
      top.appendChild(priceSpan);
      main.appendChild(top);

      var descText = textOrFallback(it.description, lang);
      if (descText) {
        var desc = document.createElement("div");
        desc.className = "item-desc";
        desc.textContent = descText;
        main.appendChild(desc);
      }

      row.appendChild(main);
      body.appendChild(row);
    });
  });

  document.getElementById("noteText").textContent = NOTE[lang] || NOTE.ja;
}

function buildLangTabs() {
  var tabsEl = document.getElementById("langTabs");
  tabsEl.innerHTML = "";
  LANGS.forEach(function (l) {
    var btn = document.createElement("button");
    btn.className = "lang-tab";
    btn.type = "button";
    btn.dataset.lang = l.code;
    btn.textContent = l.label;
    btn.setAttribute("aria-pressed", l.code === "ja" ? "true" : "false");
    btn.addEventListener("click", function () { render(l.code); });
    tabsEl.appendChild(btn);
  });
}

var TYPE_ORDER = ["cafe", "izakaya", "restaurant", "ramen", "yakiniku"];
var DEFAULT_TYPE = "cafe";
var currentType = DEFAULT_TYPE;

// 営業デモは外部通信に一切依存しない構成にする(外部サービスが落ちていてもデモ体験自体は必ず成立させるため)。
// 優先順位: 1. localStorage(demo-admin.htmlでこの端末上で編集済みならその内容) → 2. 内蔵DEFAULT_PRODUCTS。
// どちらも同期処理のみで完結するため、ネットワーク起因の「読み込み中のまま止まる」状態は原理的に発生しない。

function readLocalDemoData() {
  try {
    var raw = localStorage.getItem(DEMO_STORAGE_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) return parsed;
  } catch (err) {
    console.error("[demo] localStorage read failed, falling back to built-in sample data:", err);
  }
  return null;
}

function buildTypeSwitch() {
  var wrap = document.getElementById("typeSwitch");
  wrap.innerHTML = "";
  TYPE_ORDER.forEach(function (typeKey) {
    var btn = document.createElement("button");
    btn.className = "type-pill";
    btn.type = "button";
    btn.dataset.type = typeKey;
    btn.textContent = SAMPLE_SETS[typeKey].label;
    btn.setAttribute("aria-pressed", typeKey === currentType ? "true" : "false");
    btn.addEventListener("click", function () { selectType(typeKey); });
    wrap.appendChild(btn);
  });
}

function updateTypeSwitchState() {
  document.querySelectorAll(".type-pill").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.type === currentType ? "true" : "false");
  });
}

// カフェのみdemo-admin.htmlでの編集内容(localStorage)を反映する。
// 他の業種サンプルは常に内蔵データを表示する(編集機能は今後の対応)。
function dataForType(typeKey) {
  if (typeKey === "cafe") {
    return readLocalDemoData() || SAMPLE_SETS.cafe.products;
  }
  return SAMPLE_SETS[typeKey].products;
}

function selectType(typeKey) {
  if (!SAMPLE_SETS[typeKey]) typeKey = DEFAULT_TYPE;
  currentType = typeKey;
  updateTypeSwitchState();

  try {
    var url = new URL(window.location.href);
    url.searchParams.set("type", typeKey);
    window.history.replaceState(null, "", url);
  } catch (err) {}

  PRODUCTS = dataForType(typeKey);
  render(currentLang);
  showMenu();
}

function initialTypeFromUrl() {
  try {
    var params = new URLSearchParams(window.location.search);
    var t = params.get("type");
    if (t && SAMPLE_SETS[t]) return t;
  } catch (err) {}
  return DEFAULT_TYPE;
}

function loadProducts() {
  try {
    currentType = initialTypeFromUrl();
    buildTypeSwitch();
    PRODUCTS = dataForType(currentType);
    buildLangTabs();
    render("ja");
    showMenu();
  } catch (err) {
    console.error("[demo] fatal: failed to render even built-in sample data:", err);
    showError();
  }
}

document.getElementById("retryBtn").addEventListener("click", loadProducts);
loadProducts();
</script>
