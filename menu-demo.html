<meta charset="utf-8">
<title>Sample Café Menu</title>
<style>
:root{
  --bg:#FFFFFF;
  --text:#242220;
  --text-muted:#757068;
  --line:#E4E0DA;
  --photo-bg:#F1EEE9;
  --price:#242220;
  --danger:#B23B3B;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',
    'PingFang SC','Noto Sans SC','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
}
.page{
  width:100%;
  margin:0 auto;
  padding:40px 16px 64px;
}
.foot-mark{
  margin-top:56px;
  padding-top:28px;
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--line);
}
.foot-mark::before,.foot-mark::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}
.foot-mark span{
  font-size:1rem;
  letter-spacing:0.14em;
  color:var(--text-muted);
  white-space:nowrap;
}
.demo-tag{
  text-align:center;font-size:0.95rem;letter-spacing:0.14em;color:var(--text-muted);
  font-weight:700;margin-bottom:12px;
}
.store-name{text-align:center;font-size:3.1rem;font-weight:700;letter-spacing:0.02em;}
.lang-tabs{display:flex;justify-content:center;gap:11px;margin-top:34px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:nowrap;}
.lang-tab{background:none;border:none;padding:6px 1px 14px;font-size:1.5rem;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;white-space:nowrap;}
.lang-tab[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
.lang-tab:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
.category{margin-top:52px;margin-bottom:10px;font-size:1.45rem;letter-spacing:0.08em;color:var(--text-muted);}
.item{display:flex;gap:26px;padding:28px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.item:last-child{border-bottom:none;}
.item-photo{
  width:148px;height:148px;border-radius:18px;background:var(--photo-bg);
  display:flex;align-items:center;justify-content:center;font-size:3.4rem;flex-shrink:0;
  overflow:hidden;
}
.item-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.item-main{flex:1;min-width:0;}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;}
.item-name{font-size:2.15rem;line-height:1.35;font-weight:600;}
.item-price{font-variant-numeric:tabular-nums;color:var(--price);font-weight:600;font-size:2rem;white-space:nowrap;}
.item-desc{margin-top:8px;font-size:1.4rem;color:var(--text-muted);line-height:1.5;}
.note{margin-top:52px;font-size:1.25rem;color:var(--text-muted);line-height:1.7;text-align:center;}

.state-box{
  margin-top:60px;text-align:center;color:var(--text-muted);font-size:1.2rem;line-height:1.8;
}
.state-box.error{color:var(--danger);}
.spinner{
  width:40px;height:40px;margin:0 auto 18px;border-radius:50%;
  border:4px solid var(--line);border-top-color:var(--text);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none;}}
.retry-btn{
  margin-top:14px;padding:10px 22px;border:1px solid var(--text);border-radius:999px;
  background:none;color:var(--text);font-size:1rem;cursor:pointer;font-family:inherit;
}
.demo-hero{
  text-align:center;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line);
}
.demo-eyebrow{
  font-size:0.72rem;letter-spacing:0.18em;color:var(--text-muted);font-weight:700;margin-bottom:14px;
}
.demo-headline{
  font-size:1.6rem;font-weight:700;line-height:1.5;margin:0 0 18px;letter-spacing:0.01em;
  text-wrap:balance;
}
.lang-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.lang-pill{
  font-size:0.86rem;padding:6px 15px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-muted);background:var(--photo-bg);font-weight:600;
}
.demo-subline{
  font-size:0.94rem;color:var(--text-muted);line-height:1.7;margin:0 auto 18px;max-width:320px;
}
.demo-cta{
  display:inline-flex;align-items:center;gap:6px;font-size:0.98rem;font-weight:700;
  color:#fff;background:var(--text);text-decoration:none;padding:13px 26px;border-radius:999px;
}
.demo-cta:active{opacity:0.85;}
.admin-link{
  display:inline-block;margin:14px auto 0;text-align:center;font-size:0.95rem;
  color:var(--text-muted);text-decoration:underline;
}
.admin-link-wrap{text-align:center;}
</style>

<div class="page">
  <div class="demo-hero">
    <div class="demo-eyebrow">サンプルデモ</div>
    <h1 class="demo-headline">QRひとつで、外国人のお客様にも<br>伝わるメニュー。</h1>
    <div class="lang-pills">
      <span class="lang-pill">日本語</span><span class="lang-pill">English</span><span class="lang-pill">中文</span><span class="lang-pill">한국어</span>
    </div>
    <p class="demo-subline">店舗スタッフは管理画面から商品・価格・写真をいつでも変更できます。</p>
    <a class="demo-cta" href="demo-admin.html">管理画面デモを試す →</a>
  </div>

  <div id="demoTag" class="demo-tag" hidden></div>
  <div class="store-name" id="storeName">&nbsp;</div>

  <div id="loadingState" class="state-box">
    <div class="spinner"></div>
    <div id="loadingText">読み込み中…</div>
  </div>

  <div id="errorState" class="state-box error" hidden>
    <div id="errorText">メニューを読み込めませんでした。通信環境をご確認のうえ、もう一度お試しください。</div>
    <button type="button" class="retry-btn" id="retryBtn">再読み込み</button>
  </div>

  <div id="menuRoot" hidden>
    <div class="lang-tabs" id="langTabs" role="group" aria-label="Language"></div>
    <div id="menuBody"></div>
    <p class="note" id="noteText"></p>
    <div class="foot-mark"><span id="footStoreName"></span></div>
  </div>
</div>

<script>
"use strict";

// この画面(ページ)を開いた瞬間は必ず最上部から表示する。
// 通常読み込みだけでなく、ブラウザの「戻る」操作でbfcacheから復元された場合も対象。
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
window.addEventListener("pageshow", function () { window.scrollTo(0, 0); });

var LANGS = [
  { code: "ja", label: "日本語" },
  { code: "en", label: "English" },
  { code: "zh", label: "中文" },
  { code: "ko", label: "한국어" }
];

var NOTE = {
  ja: "表示している内容は準備状況により一部日本語のみとなる場合があります。",
  en: "Some items may be shown in Japanese only depending on translation availability.",
  zh: "部分菜品可能仅显示日文，具体取决于翻译情况。",
  ko: "번역 준비 상황에 따라 일부 메뉴는 일본어로만 표시될 수 있습니다."
};

var LOADING_TEXT = { ja: "読み込み中…", en: "Loading…", zh: "加载中…", ko: "불러오는 중…" };
var ERROR_TEXT = {
  ja: "メニューを読み込めませんでした。通信環境をご確認のうえ、もう一度お試しください。",
  en: "Could not load the menu. Please check your connection and try again.",
  zh: "无法加载菜单，请检查网络连接后重试。",
  ko: "메뉴를 불러오지 못했습니다. 통신 상태를 확인한 후 다시 시도해 주세요."
};

var PRODUCTS = null;
var currentLang = "ja";

function textOrFallback(field, lang) {
  if (!field) return "";
  if (field[lang]) return field[lang];
  return field.ja || "";
}

function els() {
  return {
    loading: document.getElementById("loadingState"),
    error: document.getElementById("errorState"),
    root: document.getElementById("menuRoot"),
  };
}

function showLoading() {
  var e = els();
  e.loading.hidden = false;
  e.error.hidden = true;
  e.root.hidden = true;
}
function showError() {
  var e = els();
  e.loading.hidden = true;
  e.error.hidden = false;
  e.root.hidden = true;
}
function showMenu() {
  var e = els();
  e.loading.hidden = true;
  e.error.hidden = true;
  e.root.hidden = false;
}

function render(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-tab").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });

  document.getElementById("storeName").textContent = textOrFallback(PRODUCTS.store_name, lang) || "Menu";
  document.getElementById("footStoreName").textContent = textOrFallback(PRODUCTS.store_name, lang) || "";

  var body = document.getElementById("menuBody");
  body.innerHTML = "";

  var visibleItems = PRODUCTS.items.filter(function (it) { return it.published !== false; });

  PRODUCTS.categories.forEach(function (cat) {
    var itemsInCat = visibleItems.filter(function (it) { return it.category === cat.id; });
    if (itemsInCat.length === 0) return;

    var catDiv = document.createElement("div");
    catDiv.className = "category";
    catDiv.textContent = textOrFallback(cat.name, lang);
    body.appendChild(catDiv);

    itemsInCat.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "item";

      var photo = document.createElement("div");
      photo.className = "item-photo";
      if (it.image) {
        var img = document.createElement("img");
        img.src = it.image;
        img.alt = textOrFallback(it.name, lang);
        img.loading = "lazy";
        img.onerror = function () {
          photo.innerHTML = "";
          photo.textContent = "🍽";
        };
        photo.appendChild(img);
      } else {
        photo.textContent = "🍽";
      }
      row.appendChild(photo);

      var main = document.createElement("div");
      main.className = "item-main";

      var top = document.createElement("div");
      top.className = "item-top";
      var nameSpan = document.createElement("span");
      nameSpan.className = "item-name";
      nameSpan.textContent = textOrFallback(it.name, lang) || "(no name)";
      var priceSpan = document.createElement("span");
      priceSpan.className = "item-price";
      var priceNum = Number(it.price);
      priceSpan.textContent = isFinite(priceNum) ? "¥" + priceNum.toLocaleString("en-US") : "";
      top.appendChild(nameSpan);
      top.appendChild(priceSpan);
      main.appendChild(top);

      var descText = textOrFallback(it.description, lang);
      if (descText) {
        var desc = document.createElement("div");
        desc.className = "item-desc";
        desc.textContent = descText;
        main.appendChild(desc);
      }

      row.appendChild(main);
      body.appendChild(row);
    });
  });

  document.getElementById("noteText").textContent = NOTE[lang] || NOTE.ja;
}

function buildLangTabs() {
  var tabsEl = document.getElementById("langTabs");
  tabsEl.innerHTML = "";
  LANGS.forEach(function (l) {
    var btn = document.createElement("button");
    btn.className = "lang-tab";
    btn.type = "button";
    btn.dataset.lang = l.code;
    btn.textContent = l.label;
    btn.setAttribute("aria-pressed", l.code === "ja" ? "true" : "false");
    btn.addEventListener("click", function () { render(l.code); });
    tabsEl.appendChild(btn);
  });
}

var DEMO_STORAGE_KEY = "demo_menu_products_v1";

var DEFAULT_PRODUCTS = {
  store_name: { ja: "Sample Café", en: "Sample Café", zh: "Sample Café", ko: "Sample Café" },
  categories: [
    { id: "drink", name: { ja: "ドリンク", en: "Drinks", zh: "饮品", ko: "음료" } },
    { id: "food", name: { ja: "フード", en: "Food", zh: "餐点", ko: "푸드" } },
    { id: "sweets", name: { ja: "スイーツ", en: "Sweets", zh: "甜点", ko: "디저트" } }
  ],
  items: [
    { id: "item-001", published: true, category: "drink",
      name: { ja: "カフェラテ", en: "Café Latte", zh: "拿铁咖啡", ko: "카페라떼" },
      description: { ja: "エスプレッソにミルクを合わせたコーヒー", en: "Espresso with steamed milk", zh: "浓缩咖啡加牛奶", ko: "에스프레소에 우유를 더한 커피" },
      price: 550, image: "images/item-001-a1b2c3d4.webp" },
    { id: "item-002", published: true, category: "drink",
      name: { ja: "自家製レモンソーダ", en: "House Lemon Soda", zh: "自制柠檬苏打水", ko: "수제 레몬 소다" },
      description: { ja: "", en: "", zh: "", ko: "" },
      price: 480, image: "images/item-002-a1b2c3d4.webp" },
    { id: "item-003", published: true, category: "food",
      name: { ja: "本日のサンドイッチ", en: "Today's Sandwich", zh: "今日三明治", ko: "오늘의 샌드위치" },
      description: { ja: "旬の野菜と自家製ソース", en: "Seasonal vegetables with house-made sauce", zh: "时令蔬菜配自制酱料", ko: "제철 채소와 수제 소스" },
      price: 980, image: "images/item-003-a1b2c3d4.webp" },
    { id: "item-004", published: true, category: "food",
      name: { ja: "特製カレー", en: "House Curry", zh: "特制咖喱", ko: "스페셜 카레" },
      description: { ja: "", en: "", zh: "", ko: "" },
      price: 1200, image: "images/item-004-a1b2c3d4.webp" },
    { id: "item-005", published: true, category: "sweets",
      name: { ja: "焼きたてチーズケーキ", en: "Baked Cheesecake", zh: "现烤芝士蛋糕", ko: "구운 치즈케이크" },
      description: { ja: "", en: "", zh: "", ko: "" },
      price: 650, image: "images/item-005-a1b2c3d4.webp" }
  ]
};

// 優先順位:
// 1. localStorage (demo-admin.htmlでこの端末上で編集済みなら、その内容を最優先で見せる)
// 2. 外部データ取得 (demo-products.json。営業チームがコードを触らず更新できる「最新のデモ内容」)
// 3. 内蔵フォールバック (DEFAULT_PRODUCTS。1と2が両方とも使えない場合の最終手段)
// エラー画面は 1〜3 のすべてが失敗した場合のみ表示する。

function readLocalDemoData() {
  try {
    var raw = localStorage.getItem(DEMO_STORAGE_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) return parsed;
  } catch (err) {
    console.error("[demo] localStorage read failed:", err);
  }
  return null;
}

function fetchExternalDemoData() {
  return fetch("demo-products.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!data || !Array.isArray(data.items) || data.items.length === 0) {
        throw new Error("demo-products.json returned no items");
      }
      return data;
    });
}

function renderProducts(data) {
  PRODUCTS = data;
  buildLangTabs();
  render("ja");
  showMenu();
}

function loadProducts() {
  showLoading();

  var local = readLocalDemoData();
  if (local) {
    try {
      renderProducts(local);
      return;
    } catch (err) {
      console.error("[demo] rendering local data failed, will try external/fallback:", err);
    }
  }

  fetchExternalDemoData()
    .then(function (data) {
      renderProducts(data);
    })
    .catch(function (err) {
      console.error("[demo] external data fetch failed, switching to built-in fallback data:", err);
      try {
        renderProducts(DEFAULT_PRODUCTS);
      } catch (err2) {
        console.error("[demo] fatal: built-in fallback also failed to render:", err2);
        showError();
      }
    });
}

document.getElementById("retryBtn").addEventListener("click", loadProducts);
loadProducts();
</script>
