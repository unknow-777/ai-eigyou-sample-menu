<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多言語QRメニュー デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --text:#242220;
  --text-muted:#757068;
  --line:#E9E6E1;
  --photo-bg:#F1EEE9;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Noto Sans JP','Noto Sans',-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:32px 20px;
}
.card{
  width:100%;
  max-width:420px;
  text-align:center;
}
.eyebrow{
  font-size:0.72rem;letter-spacing:0.18em;color:var(--text-muted);font-weight:700;margin-bottom:16px;
}
.headline{
  font-size:1.7rem;font-weight:700;line-height:1.5;margin:0 0 20px;letter-spacing:0.01em;
  text-wrap:balance;
}
.lang-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.lang-pill{
  font-size:0.86rem;padding:6px 15px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-muted);background:var(--photo-bg);font-weight:600;
}
.subline{
  font-size:0.94rem;color:var(--text-muted);line-height:1.75;margin:0 auto 32px;max-width:320px;
}
.cta-group{display:flex;flex-direction:column;gap:12px;}
.cta{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:1rem;font-weight:700;text-decoration:none;
  padding:16px 24px;border-radius:14px;font-family:inherit;
}
.cta-primary{color:#fff;background:var(--text);}
.cta-secondary{color:var(--text);background:var(--bg);border:1px solid var(--line);}
.cta:active{opacity:0.85;}
.cta-sub{
  display:block;font-size:0.74rem;font-weight:400;color:var(--text-muted);margin-top:2px;
}
.cta-primary .cta-sub{color:rgba(255,255,255,0.72);}
.footnote{margin-top:28px;font-size:0.78rem;color:var(--text-muted);}
</style>

<div class="card">
  <div class="eyebrow">サンプルデモ</div>
  <h1 class="headline">QRひとつで、外国人のお客様にも<br>伝わるメニュー。</h1>
  <div class="lang-pills">
    <span class="lang-pill">日本語</span><span class="lang-pill">English</span><span class="lang-pill">中文</span><span class="lang-pill">한국어</span>
  </div>
  <p class="subline">QRコードから4言語のメニューを表示。商品・価格・写真は、店舗スタッフが管理画面からいつでも変更できます。</p>

  <div class="cta-group">
    <a class="cta cta-primary" href="menu-demo-view.html">
      <span>お客様用メニューを体験する →</span>
    </a>
    <a class="cta cta-secondary" href="demo-admin.html">
      <span>管理画面を体験する →</span>
    </a>
  </div>

  <div class="footnote">これは営業用のサンプルデモです。実際の店舗データは含まれません。</div>
</div>

<script>
"use strict";
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
window.addEventListener("pageshow", function () { window.scrollTo(0, 0); });
</script>
