<meta charset="utf-8">
<title>Sample Café QR</title>
<style>
:root{
  --bg:#FFFFFF;
  --text:#242220;
  --text-muted:#757068;
  --line:#E4E0DA;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.page{
  width:100%;
  max-width:380px;
  padding:32px 24px;
  text-align:center;
}
.demo-tag{
  font-size:0.68rem;letter-spacing:0.14em;color:var(--text-muted);font-weight:700;
}
.store-name{
  margin-top:8px;
  font-size:1.4rem;font-weight:700;letter-spacing:0.02em;
}
.qr-frame{
  margin:32px auto 0;
  width:min(76vw, 280px);
  aspect-ratio:1/1;
  border:1px solid var(--line);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.qr-frame img{width:100%;height:100%;object-fit:contain;}
.instruction{
  margin-top:28px;
  font-size:1rem;
  font-weight:600;
  line-height:1.6;
}
.sub{
  margin-top:8px;
  font-size:0.82rem;
  color:var(--text-muted);
  line-height:1.6;
}
</style>
